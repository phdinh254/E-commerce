input {
  beats {
    port => 5044
  }
}

filter {
  # backend/src/common/logger/logger.config.ts emits single-line JSON per
  # request in production (no pino-pretty transport there — see the test
  # "disables transport in production so logs stay single-line JSON").
  # Filebeat's container input puts that raw line into [message] as a
  # string; parse it back into structured fields here.
  if [message] =~ /^\{.*\}\s*$/ {
    json {
      source => "message"
      target => "app"
      remove_field => ["message"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[app][service]:-ecommerce-backend}-%{+YYYY.MM.dd}"
  }
}
